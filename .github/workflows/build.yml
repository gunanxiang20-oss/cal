name: Build APK
on: [push]
jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev openjdk-17-jdk unzip automake autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake
          pip install buildozer cython==0.29.36
          pip install cython
      - name: Build APK
        run: |
          yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cal-toolbox-apk
          path: bin/*.apk
